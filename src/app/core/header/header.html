<!-- Contêiner principal do Cabeçalho -->
<header class="header-container">

  <!-- Linha superior: Contém a Pesquisa, a Logo e os Ícones de Ação -->
  <div class="top-bar">

    <!-- Botão Hambúrguer (Invisível no PC, aparece só no celular) -->
    <button class="mobile-menu-btn" (click)="toggleSidebar()">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fee1cf" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Lado Esquerdo: Barra de Pesquisa transformável -->
    <div class="search-container">
      <img class="search-icon" src="/lupa.svg" alt="Lupa" />
      <input type="text" class="search-input" placeholder="Pesquise por um produto" />
    </div>

    <!-- Centro: Logo da Loja -->
    <div class="logo-container">
      <img class="logo" src="/logo.png" alt="Logo Thamy Weissinger" />
    </div>

    <!-- Lado Direito: Ícones de Ação (Favoritos, Carrinho, Perfil) -->
    <div class="actions-container">
      <img class="action-icon" src="/favorito.svg" alt="Favoritos" />
      <img class="action-icon" src="/sacola.svg" alt="Carrinho" />
      <img class="action-icon" src="/perfil.svg" alt="Usuário" />
    </div>

  </div>

  <!-- Linha divisória horizontal (Vai sumir no celular junto com o menu) -->
  <div class="divider"></div>

  <!-- Linha inferior: Menu de Navegação Principal -->
  <nav class="nav-menu">
    <a href="#" class="nav-link">Masculino</a>
    <a href="#" class="nav-link">Feminino</a>
    <a href="#" class="nav-link">Peças Avulsas</a>
    <a href="#" class="nav-link">Acessórios</a>
    <a href="#" class="nav-link">Conjuntos</a>
  </nav>

  <!-- ========================================== -->
  <!-- MENU LATERAL MOBILE (Com Efeito Vidro)     -->
  <!-- ========================================== -->
  
  <!-- Fundo escuro atrás da barra lateral -->
  <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

  <!-- Barra lateral puxando suas categorias reais -->
  <div class="mobile-sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <span class="sidebar-badge">Categorias</span>
      <button class="close-btn" (click)="toggleSidebar()">✕</button>
    </div>

    <ul class="sidebar-links">
      <!-- (click)="toggleSidebar()" faz o menu fechar sozinho ao clicar em um link -->
      <li><a href="#" (click)="toggleSidebar()">Masculino</a></li>
      <li><a href="#" (click)="toggleSidebar()">Feminino</a></li>
      <li><a href="#" (click)="toggleSidebar()">Peças Avulsas</a></li>
      <li><a href="#" (click)="toggleSidebar()">Acessórios</a></li>
      <li><a href="#" (click)="toggleSidebar()">Conjuntos</a></li>
    </ul>
  </div>

</header>
