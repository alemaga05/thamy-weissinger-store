<section class="category-page">
  
  <!-- 1. BANNER PRINCIPAL -->
  <div class="banner-container">
    <img src="/categoriaFemininaPage.png" alt="Categoria Femina" class="main-banner">
  </div>

  <!-- 2. SUBCATEGORIAS (Círculos) -->
  <div class="subcategories-track">
    <div class="sub-item" *ngFor="let sub of subcategories" (click)="filtrarPorSubcategoria(sub.sub, sub.name)">
      <div class="circle-box" [class.active-circle]="subcategoriaSelecionada === sub.sub">
        <img [src]="sub.image" [alt]="sub.name">
      </div>
      <span class="sub-name">{{ sub.name }}</span>
    </div>
  </div>

  <!-- 3. SEÇÃO DE PRODUTOS PADRONIZADA -->
  <section class="popular-section">
    
    <!-- Título Superior Dinâmico -->
    <div class="title-wrapper">
      <h2 class="section-title">{{ tituloSecao }}</h2>
      
      <div class="decoration-row">
        <img src="/simboloDireitaTitulo.svg" alt="Seta" class="decor-arrow">
        <div class="line"></div>
        <img src="/simboloMeioTitulo.svg" alt="Centro" class="decor-center">
        <div class="line"></div>
        <img src="/simboloDireitaTitulo.svg" alt="Seta" class="decor-arrow">
      </div>
    </div>

    <!-- Grade de Produtos -->
    <div class="products-grid">
      
      <a [routerLink]="['/produto', product.id]" class="product-card" *ngFor="let product of products">
        
        <!-- Foto e ícone de coração -->
        <div class="image-container">
          <img [src]="product.imagemUrl" [alt]="product.nome" class="product-image">
        
          <button class="favorite-btn" 
                  [style.color]="product.isFavorito ? 'red' : 'inherit'" 
                  (click)="toggleFavorito($event, product)">
            {{ product.isFavorito ? '♥' : '♡' }}
          </button>
        </div>

        <!-- Informações do produto -->
        <div class="product-info">
          <h3 class="product-name">{{ product.nome }}</h3>
          
          <div class="price-action">
            <span class="product-price">R$ {{ product.preco | number:'1.2-2' }}</span>
            <button class="buy-btn" (click)="adicionarCarrinhoRapido($event, product)">➔</button>
          </div>
        </div>  

      </a>

    </div>
  </section>
</section>
