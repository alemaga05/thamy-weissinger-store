<!-- Adicionamos o touchstart e touchend para o celular reconhecer o dedo -->
<div class="carousel-container" 
     (mouseenter)="stopAutoPlay()" 
     (mouseleave)="startAutoPlay()"
     (touchstart)="onTouchStart($event)"
     (touchend)="onTouchEnd($event)">
  
  <!-- "Pista" que desliza para os lados -->
  <div class="carousel-track" [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
    <div class="slide" *ngFor="let slide of slides">
      <img [src]="slide.url" [alt]="slide.alt">
    </div>
  </div>

  <!-- Botões de Navegação (Setas) -->
  <button class="nav-btn prev" (click)="prevSlide()">&#10094;</button>
  <button class="nav-btn next" (click)="nextSlide()">&#10095;</button>

  <!-- Bolinhas indicadoras -->
  <div class="dots-container">
    <span class="dot" 
          *ngFor="let slide of slides; let i = index" 
          [ngClass]="{'active': i === currentIndex}" 
          (click)="currentIndex = i">
    </span>
  </div>

</div>
