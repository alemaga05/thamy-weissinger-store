<div class="admin-login-container">
  <div class="login-card">
    <div class="logo-box">
      <h2>Thamy Fitwear</h2>
      <span class="badge-admin">Painel Administrativo</span>
    </div>

    <div *ngIf="mensagemErro" class="error-alert">
      {{ mensagemErro }}
    </div>

    <form (ngSubmit)="fazerLoginAdmin()">
      <div class="form-group">
        <label for="email">E-mail Administrativo</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="admin@thamyfitwear.com" 
          required 
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input 
          type="password" 
          id="senha" 
          name="senha" 
          [(ngModel)]="senha" 
          placeholder="••••••••" 
          required 
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="carregando">
        {{ carregando ? 'Acessando...' : 'Entrar no Painel' }}
      </button>
    </form>
  </div>
</div>
